[workspace]
resolver = "2"
members = ["core", "tui"]

[package]
name = "lyre"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[[bin]]
name = "lyre"
path = "src/main.rs"

[dependencies]
lyre-core = { path = "core", default-features = false }
lyre-tui = { path = "tui", default-features = false }
ratatui.workspace = true

[features]
default = ["youtube", "gstreamer"]
youtube = ["lyre-tui/youtube", "lyre-core/youtube"]
gstreamer = ["lyre-tui/gstreamer", "lyre-core/gstreamer"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
lofty = "0.24"
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "1"
rayon = "1"
gstreamer = "0.25"
ratatui = "0.30"
crossterm = "0.29"
unicode-width = "0.2"
unicode-normalization = "0.1"

[profile.release]
opt-level = 3
debug = false
split-debuginfo = '...'
strip = "none"
debug-assertions = false
overflow-checks = false
lto = "thin"
panic = 'abort'
incremental = false
codegen-units = 1
rpath = false
